name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '0 0 * * *'

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'Dit issue is gemarkeerd als stale omdat het geen activiteit heeft gehad in de laatste 30 dagen. Het wordt over 7 dagen gesloten als er geen activiteit volgt.'
          stale-pr-message: 'Deze pull request is gemarkeerd als stale omdat het geen activiteit heeft gehad in de laatste 30 dagen. Het wordt over 7 dagen gesloten als er geen activiteit volgt.'
          close-issue-message: 'Dit issue is gesloten omdat het te lang inactief is geweest.'
          close-pr-message: 'Deze pull request is gesloten omdat het te lang inactief is geweest.'
          days-before-stale: 30
          days-before-close: 7
          exempt-issue-labels: 'pinned,security,enhancement'
          exempt-pr-labels: 'pinned,security'
